name: Lockfile- und Build-Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package-lock.json passt zu package.json
        run: node scripts/check-lockfile.mjs
      - name: Regeltests der Lock-Prüfung
        run: node --test scripts/check-lockfile.test.mjs
      - name: npm ci --legacy-peer-deps
        run: npm ci --legacy-peer-deps
      - name: Build inkl. Prerender (22 Seiten)
        run: npm run build
      - name: Prerender-Validierung
        run: node scripts/validate-prerender.mjs dist
